<style>
:root{--bg:#1b1530;--panel:#2a2147;--brass:#d4a62a;--neon:#ff3d8b;--teal:#35d0c0;--ink:#efe6d2;--mute:#a89fc0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:56px 16px 16px}
h1{font:700 34px/1.1 Georgia,serif;color:var(--brass);margin:8px 0 4px;letter-spacing:.5px}
h2{font:700 22px Georgia,serif;margin:0 0 8px}
p{margin:0 0 12px;color:var(--mute)}
.panel{background:var(--panel);border:2px solid var(--brass);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 0 0 3px var(--bg),0 0 18px #ff3d8b44}
button{font:600 16px system-ui;background:var(--brass);color:#1b1530;border:0;border-radius:10px;padding:12px 16px;min-height:44px}
button.alt{background:transparent;color:var(--teal);border:2px solid var(--teal)}
button.bad{background:var(--neon);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
input{width:100%;font:16px system-ui;padding:10px;border-radius:8px;border:2px solid #4a3f78;background:#1b1530;color:var(--ink);margin:3px 0}
.seg button{background:#1b1530;color:var(--mute);border:2px solid #4a3f78}.seg button.on{background:var(--teal);color:#1b1530;border-color:var(--teal)}
.count{font:700 28px Georgia,serif;text-align:center;flex:0 0 48px}
svg{width:100%;height:auto;display:block}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;color:#1b1530}
.big{font:700 52px Georgia,serif;text-align:center;color:var(--brass)}
.prompt{font:700 22px/1.3 Georgia,serif;margin:8px 0 12px}
.hide{display:none}.bar{height:10px;background:#1b1530;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:100%;background:var(--teal);transition:width 1s linear}
@media (prefers-reduced-motion:no-preference){.roll{animation:spin .5s}@keyframes spin{from{transform:rotate(-90deg) scale(.6)}}.gear{display:inline-block;animation:rot 9s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.glow{animation:gl 1.4s infinite alternate}@keyframes gl{to{stroke:#35d0c0;stroke-width:5}}.sab{animation:gl 1s infinite alternate}.tok{animation:bob .8s infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}.zap{animation:zp .45s}@keyframes zp{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}}

/* Landscape tablet game layout */
html,body{min-height:100%;overscroll-behavior:none}
main{max-width:480px;margin:0 auto;padding:56px 16px 16px}
.game-screen{width:100%;}
.game-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.game-brand{font:700 22px/1.1 Georgia,serif;color:var(--brass);margin:0}
.game-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.game-actions button{min-height:38px;padding:7px 12px;font-size:14px}
.game-layout{display:grid;grid-template-columns:minmax(300px,min(58vw,calc((100svh - 86px)*.607))) minmax(250px,340px);gap:14px;align-items:stretch;justify-content:center}
.board-column{position:relative;min-width:0;min-height:0;border:2px solid var(--brass);border-radius:14px;overflow:hidden;background:#120c22;box-shadow:0 0 18px #ff3d8b33}
#bd{height:min(72svh,760px);min-height:380px;margin:0;border:0;border-radius:0;overflow:hidden;background:#120c22}
#bs{height:100%;width:100%}
#bs svg{height:100%;width:100%;display:block}
.dice-dock{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #d4a62a99;border-radius:14px;background:#1b1530eF;box-shadow:0 5px 20px #0008;backdrop-filter:blur(8px)}
.dice-dock .big{font-size:38px;line-height:1;min-width:48px}
.dice-dock button{min-height:42px;padding:9px 14px}
.game-rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.game-rail .panel{margin:0;padding:14px}
.active-player{border-color:var(--teal)}
.active-player p{margin:8px 0 0}
.rail-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.status-panel.hide{display:none!important}.status-panel{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:#080611cc;backdrop-filter:blur(8px)}
.status-card{width:min(680px,100%);max-height:min(82svh,720px);overflow:auto;background:var(--panel);border:2px solid var(--brass);border-radius:18px;padding:18px;box-shadow:0 20px 70px #0009}
.status-card .row{margin:8px 0}
.status-close{float:right}
body.game-fullscreen main{max-width:none;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 14px)}
body.game-fullscreen .game-layout{grid-template-columns:minmax(300px,min(60vw,calc((100svh - 86px)*.607))) minmax(250px,340px);gap:12px;justify-content:center}

body.game-fullscreen .game-topbar{margin-bottom:8px}
body.game-fullscreen .game-brand{font-size:19px}

 body.game-fullscreen #bd{height:calc(100svh - 108px);min-height:0}
 body.game-fullscreen .game-rail{display:none}
}
@media (orientation:landscape) and (min-width:700px){
 main:has(.game-screen){padding-top:8px;padding-bottom:8px}

 .game-screen .game-topbar{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){.pg,.tok{animation:none!important}}

body.game-fullscreen .game-screen{height:100svh}
@media (min-width:701px){

</style></head><body><main id="app"></main>
<script>
const COLORS=["#ff3d8b","#35d0c0","#d4a62a","#8f7bff","#ff8a3d","#6bd96b","#4aa3ff","#f2f2a0","#ff6b6b","#c58aff"];
const TYPES={
 draw:{icon:"✏️",name:"Blueprint",who:"Draws on paper; teammates guess",items:["A steam-powered octopus","The Cogspire tower at night","A pickpocket drone","A neon dragon in a top hat","An airship docking","A robot barber","A clockwork heart","Your team’s secret hideout"]},
 act:{icon:"🎭",name:"Street Act",who:"Acts it out without speaking",items:["A malfunctioning android butler","A smuggler dodging patrol bots","Winding a giant clock","Flying an airship in a storm","A hacker typing at full speed","A cyber-pirate captain","A steam engine climbing a hill","A street vendor selling glowing noodles"]},
 move:{icon:"🏃",name:"Gear Drill",who:"Whole team moves together",items:["Form a human gear train: 3 turns in sync","Freeze like statues when the leader says ‘Alarm!’","Pass an invisible bomb around the team in 10 seconds","Walk the ‘laser corridor’ without touching the floor tiles","Everyone mimes one machine part, linked into one machine","Sneak across the room in slow motion"]},
 brain:{icon:"🧠",name:"Riddle Lock",who:"Team confers, one answers",items:["Name 5 inventions powered by steam","Name 5 famous robots or AIs from fiction","Name 6 things that glow in the dark","Name 5 jobs that exist in a big airport","Name 5 cities that begin with the same letter","Finish: ‘Neon, brass, and ___’ with 5 different ideas"]},
 hack:{icon:"⚡",name:"Code Breach",who:"Memorize the code, then recall it",items:[]},
 sabo:{icon:"⚠️",name:"Sabotage",items:[]}
};
const SYM=["⚙","♞","✦","☢","⚡","◆","☠","♜"];
const ORDER=["draw","act","move","brain","hack"];let N=60;
let S={n:4,mode:"solo",names:[]},G=null,sel=null;
const $=h=>{document.getElementById("app").innerHTML=h};
let AC=null,mute=false;
function tone(f,d,t="square",v=.08,at=0){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const SFX={tick:()=>tone(520,.07,"square",.05),roll:()=>tone(180+Math.random()*200,.06,"sawtooth",.05),ok:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",.1,i*.09)),bad:()=>[300,220,150].forEach((f,i)=>tone(f,.2,"sawtooth",.09,i*.12)),zap:()=>[900,300,700,200].forEach((f,i)=>tone(f,.1,"square",.07,i*.07)),win:()=>[523,659,784,659,784,1046,1318].forEach((f,i)=>tone(f,.25,"triangle",.1,i*.12)),alarm:()=>tone(880,.5,"square",.08)};
const mv=(t,n)=>{t.pos=Math.max(0,Math.min(N-2,cap(t,t.pos+n)))};
function sw(t,lead){const o=G.t.filter(x=>x!=t).sort((a,b)=>lead?b.pos-a.pos:a.pos-b.pos)[0];if(o){[t.pos,o.pos]=[o.pos,t.pos];[t,o].forEach(x=>{const g=G.gates[x.frag];if(x.frag<3&&x.pos>g)x.pos=g})}}
const CARDS=[
 ["Steam leak","A pipe bursts under your team. Move back 2.",t=>mv(t,-2)],
 ["Power surge","A rogue current launches you ahead. Move forward 3.",t=>mv(t,3)],
 ["Smog cloud","Visibility zero. Skip your next turn.",t=>{t.skip=1}],
 ["Swap meet","Trade places with the team in last place.",t=>sw(t,false)],
 ["Heist","Trade places with the team in the lead.",t=>sw(t,true)],
 ["Tailwind","An airship gives you a lift. Move forward 2.",t=>mv(t,2)]];
function sabotage(){const t=G.t[G.cur],c=CARDS[Math.floor(Math.random()*CARDS.length)];SFX.zap();c[2](t);
 $(`<div class="panel zap" style="border-color:var(--neon)"><span class="chip" style="background:${t.c}">${t.name}</span><h2 style="margin-top:8px">⚠️ Sabotage: ${c[0]}</h2><p style="color:var(--ink)">${c[1]}</p><div class="big">⚡</div><button style="width:100%" onclick="nextTurn('Sabotage resolved')">Continue</button></div>`)}
function nextTurn(msg){G.rolled=null;while(true){G.cur=(G.cur+1)%G.t.length;const t=G.t[G.cur];if(t.skip){t.skip=0;msg=t.name+" skipped a turn";continue}break}board(msg)}
function hop(t,to,cb){const iv=setInterval(()=>{if(t.pos==to){clearInterval(iv);return cb()}t.pos+=t.pos<to?1:-1;SFX.tick();const b=document.getElementById("bd");if(b)b.innerHTML=boardSvg()},200)}
const tileType=i=>i==0?"start":i==N-1?"spire":G.gates.includes(i)?"gate":i%7==3?"sabo":i%11==6?"warp":ORDER[(i*5+Math.floor(i/7))%7];
function pos(i){const r=Math.floor(i/6),c=r%2?5-i%6:i%6;return[40+c*56,36+r*56]}
function setup(){
 while(S.names.length<10)S.names.push("");
 const teams=S.mode=="teams";
 $(`<h1><span class="gear">⚙</span> Cogspire</h1><p>The Neon Ascent. Race through the smog-bound districts and reach the Spire first.</p>
 <div class="panel"><h2>Players</h2><div class="row"><button class="alt" onclick="S.n=Math.max(2,S.n-1);setup()" aria-label="Fewer players">−</button><div class="count">${S.n}</div><button class="alt" onclick="S.n=Math.min(10,S.n+1);setup()" aria-label="More players">+</button></div>
 <div class="row seg" style="margin-top:10px"><button class="${teams?"":"on"}" onclick="S.mode='solo';setup()">Solo</button><button class="${teams?"on":""}" onclick="S.mode='teams';setup()">Teams of 2</button></div></div>
 <div class="panel"><h2>Names</h2>${Array.from({length:S.n},(_,i)=>`<input aria-label="Player ${i+1}" placeholder="Player ${i+1}" value="${S.names[i]}" oninput="S.names[${i}]=this.value">`).join("")}</div>
 <button style="width:100%" onclick="start()">Start the ascent</button>`);
}
function start(){
 const p=Array.from({length:S.n},(_,i)=>S.names[i].trim()||"Player "+(i+1));
 let units=[];
 if(S.mode=="teams"&&p.length>=4){for(let i=0;i<p.length;i+=2)units.push(p.slice(i,i+2));if(units.length>1&&units[units.length-1].length==1)units[units.length-2].push(units.pop()[0])}
 else units=p.map(x=>[x]);
 G={t:units.map((m,i)=>({m,pos:0,turn:0,c:COLORS[i],name:m.join(" & ")})),cur:0,rolled:null};
 board();
}
function boardSvg(){
 let s=`<svg viewBox="0 0 340 580" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Game board"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a1f6e"/><stop offset=".6" stop-color="#2a1a4a"/><stop offset="1" stop-color="#1b1530"/></linearGradient></defs><rect width="340" height="580" rx="10" fill="url(#sk)"/><path d="M0 580V500l28-24v-65h20v50l22-20v-60h20v78l24-24h22v64l24-30h20v-60h20v82l22-24v-40h20v72l20-30h24v111z" fill="#120c22" opacity=".72"/><circle cx="268" cy="38" r="24" fill="#ff3d8b" opacity=".3"/><path d="M0 290V215l20-18v-30h18v22l14-12v38l22-16v-44h16v60l24-30h22v56l20-26h18v-40h20v66l22-24v-20h20v54l20-34h24v90z" fill="#120c22" opacity=".85"/><g transform="translate(55 62)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/><circle r="30" fill="none" stroke="#d4a62a" stroke-width="8" stroke-dasharray="7.9 7.9" opacity=".2"/><circle r="22" fill="none" stroke="#d4a62a" stroke-width="3" opacity=".2"/></g></g><g transform="translate(290 235)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/><circle r="40" fill="none" stroke="#35d0c0" stroke-width="9" stroke-dasharray="10.4 10.4" opacity=".16"/><circle r="30" fill="none" stroke="#35d0c0" stroke-width="3" opacity=".16"/></g></g>`;
 for(let i=1;i<N;i++){const[a,b]=pos(i-1),[c,d]=pos(i);s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#6b5420" stroke-width="11" stroke-linecap="round"/><line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#35d0c0" stroke-width="2" stroke-dasharray="4 4"/>`}
 for(let i=0;i<N;i++){const[x,y]=pos(i),t=tileType(i),ic=t=="start"?"🏁":t=="spire"?"🗼":TYPES[t].icon;
  s+=`<circle class="${t=="spire"?"glow":t=="sabo"?"sab":""}" cx="${x}" cy="${y}" r="20" fill="${t=="spire"?"#d4a62a":TC[t]||"#2a2147"}" stroke="${t=="spire"||t=="sabo"?"#ff3d8b":"#d4a62a"}" stroke-width="2.5"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="18">${ic}</text>`}
 G.t.forEach((t,k)=>{const[x,y]=pos(t.pos);s+=`<circle class="tok" cx="${x-14+(k%4)*9}" cy="${y+18-Math.floor(k/4)*9}" r="6" fill="${t.c}" stroke="#1b1530" stroke-width="2"/>`});
 return s+"</svg>";
}
function board(msg){
 const t=G.t[G.cur];
 $(`<div class="panel" style="padding:8px" id="bd">${boardSvg()}</div>
 <div class="panel"><span class="chip" style="background:${t.c}">${t.name}</span><h2 style="margin-top:8px">${msg||"Your move"}</h2>
 <p>Tile ${t.pos} of ${N-1}. Roll the die to advance.</p>
 <div class="big" id="dice">🎲</div>
 <button style="width:100%" onclick="roll()">Roll the die</button></div>
 <div class="row"><button class="alt" onclick="setup()">New game</button><button class="alt" onclick="mute=!mute;this.textContent=mute?'Sound off':'Sound on'">${mute?"Sound off":"Sound on"}</button></div>`);
}
function roll(){

<h2>Goal</h2><p>Claim 3 💎 Core Fragments, one from each Core Gate in order, then reach the 🗼 Spire before anyone else.</p>

<h2>Who judges</h2><p>Teams that are not performing decide Success or Fail, and a majority wins any argument. No hints while the timer runs. Performers rotate within a team.</p>
<h2>Challenges</h2><ul><li>✏️ <b>Quick Sketch</b>: one player draws the secret prompt, no letters, numbers, or talking. Teammates guess within 60 seconds.</li><li>🎭 <b>Charades</b>: act out a movie, animal, or action with no words or sounds. Teammates guess within 60 seconds. Peek shows the move, if one exists.</li><li>🏃 <b>Duo Challenge</b>: you and your team partner do a funny paired task. Solo players get a different challenge instead. Every task has a clear Pass rule, and the other teams judge it within 45 seconds.</li><li>🧠 <b>Riddle Lock</b>: pick the right answer within 25 seconds. The app checks it.</li><li>⚡ <b>Code Breach</b>: memorize 5 symbols in 5 seconds, then enter them in order.</li><li>🔤 <b>Category Blitz</b>: name items in a category for 30 seconds and tap + for each. Reach the target to win.</li><li>🎤 <b>Sing Along</b>: sing a short tune (about 7 seconds) into the microphone and follow the pitch line on screen. Any key works. You pass by staying in tune at least 40% of the time. If the microphone is unavailable, the judges decide.</li></ul>
<h2>Special tiles</h2><ul><li>💎 <b>Core Gate</b>: your movement stops at your next gate. Win its challenge to claim the fragment. Failing costs nothing but a turn.</li><li>⚠️ <b>Sabotage</b>: draw a random card. Some help, some hurt.</li><li>🌀 <b>Warp</b>: jump forward 5 tiles, or to your next gate.</li></ul>
